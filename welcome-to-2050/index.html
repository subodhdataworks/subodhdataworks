<!doctype html>
<html lang="en" style="background-color: #FFFFFF;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/future_it_emblem.png" />
    <link rel="apple-touch-icon" href="/images/brand/future_it_emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FUTURE AI" />
    <meta name="application-name" content="FUTURE AI" />
    <title>FUTURE IT INDUSTRY | Learn Today. Earn Tomorrow.</title>
    <meta name="description" content="FUTURE IT INDUSTRY: Learn Skills. Build Projects. Get Job-Ready with dedicated placement support. Learn Today. Earn Tomorrow." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAFCFE] text-[#0F172A] min-h-screen font-sans antialiased selection:bg-sky-500/20 selection:text-sky-900 overflow-x-hidden" style="background-color: #FFFFFF;">
    <div id="root"></div>
    <script>
      // Register Service Worker for PWA Add-to-Home-Screen support & immediate update check
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
            console.log('[PWA] Service Worker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
